name: docker
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Build frontend
        run: cd web/static && npm install && npm run build

      - name: Build binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/atvloadly-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o build/atvloadly-linux-arm64 .

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_NAME=atvloadly
          tags: |
            ghcr.io/safe-canvas/atvloadly:latest
            ghcr.io/safe-canvas/atvloadly:${{ github.sha }}
